name: BloodborneX Linux preview
on:
  push:
    branches: [codex/bloodbornex-fg-preview-1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bloodbornex-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          submodules: recursive
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/02c087f3fe673c9e317f206a627cb6b910336dbe.tar.gz
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 2
            cores = 2
      - name: Build and verify
        run: nix-shell packaging/bloodbornex-shell.nix --run 'bash packaging/bloodbornex-ci.sh'
      - name: Permit the AppImage user namespace smoke test
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Package and smoke test
        run: nix-shell packaging/bloodbornex-shell.nix --run 'bash packaging/bloodbornex-ci-package.sh'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: BloodborneX-fg-preview.1-linux-x86_64
          path: stage/BloodborneX/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: BloodborneX-build-diagnostics
          path: |
            out/*log
            out/gpu/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7
